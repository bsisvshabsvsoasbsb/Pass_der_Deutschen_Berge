org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 aktiviert standardmaessig das eingebaute Kotlin-Plugin und die neue DSL.
# Dieses Projekt nutzt bewusst das klassische Kotlin-Android-Plugin, weil damit
# die Kotlin-Version explizit (ueber den Version Catalog) gepinnt werden kann und
# das Compose-Compiler-Plugin garantiert versionsgleich laeuft.
# Beide Schalter sind bis AGP 10 verfuegbar.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
