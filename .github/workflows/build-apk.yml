name: APK bauen

on:
  push:
    branches: [claude/android-app-multilingual-map-la76fe, main]
    paths-ignore: ['**.md', '.github/workflows/probe-versions.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Der secrets-Kontext ist in step-level if-Bedingungen nicht erlaubt,
    # auf Job-Ebene als env aber schon.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # API 37 liegt auf dem Runner nur mit Minor-Version vor
      # (android-37.0/.1/.2); dieses Projekt baut deshalb gegen 36.
      - name: Android SDK bereitstellen
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0" > /dev/null || true
          ls "$ANDROID_HOME/platforms"

      # Diagnose: welche compileSdk-Eigenschaften kennt diese AGP-Version?
      # Die Minor-Version-DSL ist noch jung, ihr Name aendert sich zwischen
      # AGP-Linien - hier steht er schwarz auf weiss.
      - name: AGP-DSL pruefen
        continue-on-error: true
        run: |
          set -uo pipefail
          JAR=$(find ~/.gradle/caches -name 'gradle-api-*.jar' -o -name 'common-*.jar' 2>/dev/null | head -3)
          echo "gefundene AGP-Jars: $JAR"
          for j in $(find ~/.gradle/caches -path '*com.android.tools.build*' -name '*.jar' 2>/dev/null | head -40); do
            if unzip -l "$j" 2>/dev/null | grep -q 'CommonExtension'; then
              echo "== $j"
              unzip -p "$j" 'com/android/build/api/dsl/CommonExtension.class' 2>/dev/null \
                | strings | grep -iE 'compileSdk[A-Za-z]*' | sort -u | head -20
            fi
          done

      - name: Unit-Tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Lint (bricht bei fehlenden Uebersetzungen)
        run: ./gradlew --no-daemon lintDebug

      # Release wird nur signiert gebaut, wenn ein eigener Keystore als Secret
      # hinterlegt ist. Ohne Secrets bleibt es beim Debug-APK - das laesst sich
      # ebenfalls per Sideload installieren, taugt aber nicht fuer Updates,
      # weil der Debug-Schluessel je Build-Maschine ein anderer ist.
      - name: Keystore aus Secret entpacken
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Signiertes Release-APK bauen
        if: steps.keystore.outputs.available == 'true'
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Signatur pruefen
        if: steps.keystore.outputs.available == 'true'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --print-certs "$APK"

      - name: Keystore entfernen
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: APK als Artefakt anhaengen
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pass-der-deutschen-berge-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Testberichte bei Fehlschlag anhaengen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          retention-days: 7

      # Bewusst als letzter Schritt: so stehen die Befunde am Ende des Logs
      # und werden nicht von der Artefakt-Ausgabe verdeckt.
      - name: Lint-Fehler ausgeben
        if: always()
        run: |
          F=app/build/reports/lint-results-debug.txt
          if [ -f "$F" ]; then
            echo "===== LINT: FEHLER ====="
            grep -nE "Error: |Fehler: " "$F" | head -40 || echo "(keine Error-Zeilen)"
            echo "===== LINT: ZUSAMMENFASSUNG ====="
            tail -3 "$F"
          else
            echo "kein Lint-Textreport gefunden"
          fi
