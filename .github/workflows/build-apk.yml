name: APK bauen

on:
  push:
    branches:
      - main
      - claude/android-app-multilingual-map-la76fe
      - 'dev/**'          # persoenliche Arbeitszweige
    paths-ignore: ['**.md', '.github/workflows/probe-versions.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Der secrets-Kontext ist in step-level if-Bedingungen nicht erlaubt,
    # auf Job-Ebene als env aber schon.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Prueft gradle-wrapper.jar gegen Gradles offizielle Pruefsummenliste.
      # Die JAR wird beim Build ausgefuehrt und ist der klassische Angriffspunkt
      # in Gradle-Projekten - deshalb vor allem anderen.
      - name: Gradle-Wrapper verifizieren
        uses: gradle/actions/wrapper-validation@v4

      - name: Pruefsummen protokollieren
        run: |
          set -euo pipefail
          echo "gradle-wrapper.jar:      $(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d" " -f1)"
          echo "gradle-9.6.0-bin.zip:    $(curl -sL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256)"
          echo "assets/pass_data.json:   $(sha256sum app/src/main/assets/pass_data.json | cut -d" " -f1)"
          echo "assets/germany.json:     $(sha256sum app/src/main/assets/germany.json | cut -d" " -f1)"

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # API 37 liegt auf dem Runner nur mit Minor-Version vor
      # (android-37.0/.1/.2); dieses Projekt baut deshalb gegen 36.
      - name: Android SDK bereitstellen
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0" > /dev/null || true
          ls "$ANDROID_HOME/platforms"

      - name: Unit-Tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/tests.log

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Lint (bricht bei fehlenden Uebersetzungen)
        run: ./gradlew --no-daemon lintDebug

      # Release wird nur signiert gebaut, wenn ein eigener Keystore als Secret
      # hinterlegt ist. Ohne Secrets bleibt es beim Debug-APK - das laesst sich
      # ebenfalls per Sideload installieren, taugt aber nicht fuer Updates,
      # weil der Debug-Schluessel je Build-Maschine ein anderer ist.
      - name: APK pruefen und benennen
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mkdir -p dist
          cp "$SRC" "dist/PassDerDeutschenBerge-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          echo "===== APK-Kenndaten ====="
          "$AAPT" dump badging "dist/PassDerDeutschenBerge-debug.apk" \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission|native-code)" || true
          echo "===== Enthaltene Assets ====="
          unzip -l "dist/PassDerDeutschenBerge-debug.apk" | grep -E "assets/" || true
          echo "size=$(du -h "dist/PassDerDeutschenBerge-debug.apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Keystore aus Secret entpacken
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Signiertes Release-APK bauen
        if: steps.keystore.outputs.available == 'true'
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Signatur pruefen
        if: steps.keystore.outputs.available == 'true'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --print-certs "$APK"

      - name: Keystore entfernen
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Release-APK benennen
        if: steps.keystore.outputs.available == 'true'
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$SRC" "dist/PassDerDeutschenBerge.apk"

      - name: APK als Artefakt anhaengen
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pass-der-deutschen-berge-apk
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      # Ein Release-Asset laesst sich direkt auf dem Telefon herunterladen;
      # Actions-Artefakte sind ZIP-Dateien hinter der GitHub-Anmeldung.
      # Nur vom Integrationszweig. Wuerden auch die persoenlichen Zweige
      # veroeffentlichen, ueberschriebe sich das Release "app-latest"
      # gegenseitig und niemand wuesste, wessen Stand darin liegt.
      - name: APK als Release veroeffentlichen
        if: >-
          ${{ success() && github.event_name == 'push' &&
              (github.ref_name == 'main' ||
               github.ref_name == 'claude/android-app-multilingual-map-la76fe') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="app-latest"
          if [ -f dist/PassDerDeutschenBerge.apk ]; then
            VARIANTE="Signiertes Release-APK (eigener Keystore)."
          else
            VARIANTE="Debug-APK. Installierbar, aber je Build anders signiert - fuer Updates ohne Neuinstallation bitte die Keystore-Secrets hinterlegen."
          fi
          NOTES="Automatischer Build aus ${GITHUB_SHA::7} (${GITHUB_REF_NAME}).

          ${VARIANTE}

          Installation: APK auf dem Telefon herunterladen und oeffnen. Android
          fragt einmalig nach der Berechtigung, Apps aus dieser Quelle zu
          installieren (Einstellungen der Browser- oder Dateien-App).

          Die App braucht keine Berechtigungen und arbeitet vollstaendig offline."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --prerelease
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "Pass der Deutschen Berge - aktueller Build" \
              --notes "$NOTES" --prerelease
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Testberichte bei Fehlschlag anhaengen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          retention-days: 7

      # Bewusst als letzter Schritt: so stehen die Befunde am Ende des Logs
      # und werden nicht von der Artefakt-Ausgabe verdeckt.
      - name: Lint-Fehler ausgeben
        if: always()
        run: |
          F=app/build/reports/lint-results-debug.txt
          if [ -f "$F" ]; then
            echo "===== LINT: FEHLER ====="
            grep -nE "Error: |Fehler: " "$F" | head -40 || echo "(keine Error-Zeilen)"
            echo "===== LINT: ZUSAMMENFASSUNG ====="
            tail -3 "$F"
          else
            echo "kein Lint-Textreport gefunden"
          fi

      # Compiler- und Testfehler stehen sonst mitten im Protokoll und werden
      # von der nachfolgenden Ausgabe verdeckt.
      - name: Compiler- und Testfehler ausgeben
        if: failure()
        run: |
          echo "===== KOTLIN-/COMPILERFEHLER ====="
          grep -E "^e: |error:|Unresolved reference|Type mismatch|None of the following" /tmp/tests.log | head -40 || echo "(keine)"
          echo "===== FEHLGESCHLAGENE TESTS ====="
          grep -E "FAILED|expected:|AssertionError" /tmp/tests.log | head -40 || echo "(keine)"
          echo "===== LETZTE ZEILEN ====="
          tail -25 /tmp/tests.log || true
