# Alle Versionen wurden gegen Google Maven bzw. Maven Central verifiziert
# (siehe .github/workflows/probe-versions.yml). Keine dynamischen Versionen.
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"   # -> compose-ui 1.11.4, material3 1.4.0 (im Probe-Lauf verifiziert)
activityCompose = "1.13.0"
appcompat = "1.8.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
junit = "4.13.2"
jsonJvm = "20251224"   # echtes org.json fuer JVM-Tests; android.jar liefert nur Stubs

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
json-jvm = { group = "org.json", name = "json", version.ref = "jsonJvm" }

[bundles]
compose = ["compose-ui", "compose-ui-graphics", "compose-foundation", "compose-material3", "compose-ui-tooling-preview"]
lifecycle = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
